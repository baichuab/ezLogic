databases:
  - name: ezlogic-db
    databaseName: ezlogic
    user: ezlogic # "postgres" is reserved on Render
    postgresMajorVersion: "16"
    plan: free # Free Postgres expires 30 days after creation (1 GB storage)

services:
  - type: web
    name: ezlogic-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free # 512 MB RAM, spins down after 15 min idle
    # Persistent disks aren't available on the free plan; /data is ephemeral
    # and gets re-seeded from /opt/lean-project by entrypoint.sh on each start.
    envVars:
      - key: PORT
        value: "8000"
      - key: DATABASE_URL
        fromDatabase:
          name: ezlogic-db
          property: connectionString
      - key: OPENROUTER_API_KEY
        sync: false # Prompted for in the Render Dashboard
      - key: GUEST_JWT_SECRET
        generateValue: true
      - key: GUEST_COOKIE_SECURE
        value: "true"
      - key: LEAN_WARMUP
        value: "false" # Skip Mathlib preload so the API boots in 512 MB; set "true" after upgrading
      - key: FRONTEND_URL
        value: https://ezlogic-web.onrender.com # Update if Render assigns a different URL

  - type: web
    name: ezlogic-web
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    plan: free
    envVars:
      - key: PORT
        value: "80"
      - key: DOMAIN
        value: ":80"
      # Free services can't use Render's private network, so proxy via the public URL.
      - key: BACKEND_URL
        value: https://ezlogic-backend.onrender.com # Update if Render assigns a different URL
